# Native package engine = the OFFICIAL Termux packages, straight from the web (nothing is rebuilt, mirrored or faked):
#   apt repo : https://packages.termux.dev/apt/termux-main   (signed; apt checks it with the real termux-keyring)
#   bootstrap: newest "bootstrap-*+apt.android-7" release of https://github.com/termux/termux-packages (checked with its sha256)
#   pip      : the real python-pip package; "pip install x" downloads from the real PyPI (pypi.org)
# This only works because the app id is com.termux (see app/build.gradle.kts). Uninstall the real Termux app first.
NAT_MODE=termux
NAT_REPO_URL="https://packages.termux.dev/apt/termux-main"
NAT_RELEASES_API="https://api.github.com/repos/termux/termux-packages/releases?per_page=40"
# optional: pin one bootstrap zip (and its sha256) instead of "newest"
NAT_BOOTSTRAP_URL=""
NAT_BOOTSTRAP_SHA256=""
# Custom self-built repo (old behaviour, tools/build-repo.sh): set NAT_MODE=custom and NAT_BASE_URL=https://...
NAT_BASE_URL=""
