# Native (Termux-style) package repo. Plain static files on any HTTPS host - nothing runs on a runner when you install.
#   <URL>/bootstrap-<arch>.zip          (+ .sha256)   downloaded once, on the first "pkg install"
#   <URL>/apt/dists/... /apt/pool/...                 the apt repo that "pkg install" pulls .deb files from
# Produce all of it with tools/build-repo.sh (that is the slow, hours-long build - done once, by you, not on the phone).
# Empty = native engine off, Macoid keeps using the Alpine fallback.
# Override per phone without rebuilding: put NAT_BASE_URL=... in ~/.macoid/native.conf, or export MACOID_REPO=...
NAT_BASE_URL=""
