name: macoid
on:
  push:
    branches: ["job-**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: maven
          path: |
            **/target/*.jar
            **/target/*.war
          retention-days: 3
