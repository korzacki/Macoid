name: macoid
on:
  push:
    branches: ["job-**"]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS app and .ipa
        run: |
          set -e
          [ -f .macoid/env ] && . .macoid/env
          if ls -d *.xcworkspace >/dev/null 2>&1; then SPEC="-workspace $(ls -d *.xcworkspace | head -1)"; else SPEC="-project $(ls -d *.xcodeproj | head -1)"; fi
          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild -list -json $SPEC | python3 -c "import json,sys; d=json.load(sys.stdin); p=d.get('workspace') or d.get('project'); print(p['schemes'][0])")
          fi
          echo "Scheme: $SCHEME"
          xcodebuild $SPEC -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build -quiet \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr out/app-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: out/app-unsigned.ipa
          retention-days: 3
