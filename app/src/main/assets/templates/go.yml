name: macoid
on:
  push:
    branches: ["job-**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Cross-compile
        run: |
          mkdir -p out
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o "out/app-$os-$arch$ext" ./...  || CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o "out/app-$os-$arch$ext" .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: go
          path: out
          retention-days: 3
