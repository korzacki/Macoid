name: macoid
on:
  push:
    branches: ["job-**"]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        shell: bash
        run: |
          swift build -c release
          mkdir -p out
          find .build/release -maxdepth 1 -type f -perm -u+x -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: swift-macos
          path: out
          if-no-files-found: ignore
          retention-days: 3
