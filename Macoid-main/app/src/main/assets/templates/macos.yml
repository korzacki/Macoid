name: macoid
on:
  push:
    branches: ["job-**"]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: |
          set -e
          [ -f .macoid/env ] && . .macoid/env
          if ls -d *.xcworkspace >/dev/null 2>&1; then SPEC="-workspace $(ls -d *.xcworkspace | head -1)"; else SPEC="-project $(ls -d *.xcodeproj | head -1)"; fi
          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild -list -json $SPEC | python3 -c "import json,sys; d=json.load(sys.stdin); p=d.get('workspace') or d.get('project'); print(p['schemes'][0])")
          fi
          xcodebuild $SPEC -scheme "$SCHEME" -configuration Release -sdk macosx -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p out
          for a in build/Build/Products/Release/*.app; do ditto -c -k --keepParent "$a" "out/$(basename "$a").zip"; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: out/*.zip
          retention-days: 3
