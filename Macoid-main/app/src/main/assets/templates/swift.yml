name: macoid
on:
  push:
    branches: ["job-**"]
jobs:
  build:
    # Linux runner: boots in seconds, Swift is preinstalled, and it costs 1x minutes (macOS costs 10x).
    # Code that imports SwiftUI/UIKit/... uses swift-mac.yml instead (macoid picks it automatically).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        shell: bash
        run: |
          swift build -c release
          mkdir -p out
          find .build/release -maxdepth 1 -type f -perm -u+x -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: swift-linux
          path: out
          if-no-files-found: ignore
          retention-days: 3
