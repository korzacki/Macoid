name: macoid
on:
  push:
    branches: ["job-**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - run: npm ci || npm install
      - run: npm run build --if-present
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            dist
            build
            out
          if-no-files-found: ignore
          retention-days: 3
