name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          [ -n "$ZIP" ] || { echo "No .zip in repo root. Upload it first."; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -40
      - name: Extract with folders
        run: |
          unzip -o "$ZIP" -x '.git/*' '.github/*' '.history/*' '.vscode/*'
          rm -f "$ZIP"
          find . -path ./.git -prune -o -type f -print | head -80
      - name: Commit
        run: |
          git config user.name "korzacki"
          git config user.email "undulkucingcat@gmail.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Macoid 2.0"
          git push
