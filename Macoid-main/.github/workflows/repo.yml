name: Build native package repo
# The slow, hours-long, one-time build (the Termux way). Installs on the phone never touch GitHub Actions:
# they only download the finished .deb files from GitHub Pages.
#
# One-time setup:  Settings -> Pages -> Source: "GitHub Actions".  Then run this workflow (Actions -> Run workflow).
# When it ends, the summary shows the URL. Put it in Settings -> Secrets and variables -> Actions -> Variables as
# NAT_BASE_URL (the APK workflow writes it into the app), or edit app/src/main/assets/lib/native.conf.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU architectures (space separated): aarch64 arm x86_64 i686"
        default: "aarch64"
      full:
        description: "Also build ruby golang rust ffmpeg ... (much longer, and may not fit the 1 GB Pages limit)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARCHES: ${{ inputs.arch }}
  FULL: ${{ inputs.full && '1' || '0' }}

jobs:
  base:
    name: base (bootstrap packages)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (termux builds are big)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - name: Build bootstrap packages
        run: ./tools/build-repo.sh build $(./tools/build-repo.sh boot-pkgs)
      - uses: actions/upload-artifact@v4
        with:
          name: debs-base
          path: work/termux-packages/output/*.deb
          retention-days: 3
          compression-level: 0

  extra:
    name: ${{ matrix.name }}
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: python,  pkgs: "python python-pip" }
          - { name: nodejs,  pkgs: "nodejs" }
          - { name: compilers, pkgs: "clang make cmake" }
          - { name: tools,   pkgs: "git openssh curl wget jq ripgrep rsync vim tmux zip htop sqlite libxml2-utils" }
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
      - name: Prepare termux-packages
        run: ./tools/build-repo.sh prepare
      - uses: actions/download-artifact@v4
        with:
          name: debs-base
          path: work/termux-packages/output
      - name: Build ${{ matrix.name }}
        run: ./tools/build-repo.sh build ${{ matrix.pkgs }}
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.name }}
          path: work/termux-packages/output/*.deb
          retention-days: 3
          compression-level: 0

  publish:
    name: publish to GitHub Pages
    needs: extra
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils zip curl
      - name: Prepare termux-packages
        run: ./tools/build-repo.sh prepare
      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: work/termux-packages/output
      - name: Build apt repo
        run: ./tools/build-repo.sh repo
      - name: Build bootstraps
        run: ./tools/build-repo.sh bootstrap
      - name: Size check (Pages limit is 1 GB)
        run: |
          du -sh dist dist/*
          [ "$(du -sm dist | cut -f1)" -lt 1000 ] || { echo "::error::dist is over 1 GB - build fewer packages or host elsewhere"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Summary
        run: |
          echo "### Native repo published" >> "$GITHUB_STEP_SUMMARY"
          echo "NAT_BASE_URL = \`${{ steps.deploy.outputs.page_url }}\`" >> "$GITHUB_STEP_SUMMARY"
