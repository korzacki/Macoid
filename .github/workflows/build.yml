name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the app at the native package repo (repo variable NAT_BASE_URL, set after "Build native package repo" ran)
        env: { NAT: "${{ vars.NAT_BASE_URL }}" }
        run: |
          [ -n "$NAT" ] && sed -i "s|^NAT_BASE_URL=.*|NAT_BASE_URL=\"${NAT%/}\"|" app/src/main/assets/lib/native.conf || echo "NAT_BASE_URL not set: native engine stays off"
          grep '^NAT_BASE_URL' app/src/main/assets/lib/native.conf
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Macoid-apk
          path: app/build/outputs/apk/debug/app-debug.apk
