name: Patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          F=app/src/main/java/com/macoid/terminal/GitCmd.kt
          sed -i 's|o.v("--depth")?.toIntOrNull()?.let { c.setDepth(it) }|if (o.v("--depth") != null) System.err.println("warning: --depth ignored, doing a full clone")|' "$F"
          ! grep -q setDepth "$F" || { echo "patch did not apply"; exit 1; }
          git config user.name "korzacki"
          git config user.email "undulkucingcat@gmail.com"
          git add -A
          git commit -m "Fix: remove CloneCommand.setDepth"
          git push
